server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      tracking-modes: []

spring:
  application:
    name: hospital-order-service
  datasource:
    url: jdbc:h2:file:./data/hospital_orders_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

grpc:
  client:
    warehouseService:
      address: ${WAREHOUSE_GRPC_ADDRESS:static://localhost:9090}
      negotiationType: plaintext

medsupply:
  hospital:
    id: ${HOSPITAL_ID:APHP-SAINT-LOUIS-PARIS}
    rpc-deadline-ms: ${WAREHOUSE_RPC_DEADLINE_MS:3500}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4200,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.medsupply.hospital: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [hospital-rest] [corr=%X{correlationId:-none}] %logger{36} - %msg%n"
