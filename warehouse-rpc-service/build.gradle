plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    implementation project(':warehouse-rpc-contract')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.all {
    resolutionStrategy {
        force 'io.grpc:grpc-stub:1.63.0'
        force 'io.grpc:grpc-protobuf:1.63.0'
        force 'io.grpc:grpc-core:1.63.0'
        force 'io.grpc:grpc-api:1.63.0'
        force 'io.grpc:grpc-netty-shaded:1.63.0'
    }
}
