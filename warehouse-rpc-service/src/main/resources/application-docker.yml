spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://warehouse-db:5432/warehouse_db}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:warehouse_user}
    password: ${SPRING_DATASOURCE_PASSWORD:warehouse_secret}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
